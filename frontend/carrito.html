<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>CarritoGT - Mi carrito</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <a href="index.html">CarritoGT</a>
        <a href="index.html">← Seguir comprando</a>
    </header>

    <div class="container">
        <h1>Mi carrito de compra</h1>
        <table>
            <thead>
                <tr>
                    <th>Producto</th>
                    <th>Precio</th>
                    <th>Cantidad</th>
                    <th>Subtotal</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="cuerpo-carrito">
                <tr><td colspan="5">Cargando...</td></tr>
            </tbody>
        </table>
        <p class="total">Total: <span id="total">Q 0.00</span></p>
        <button id="vaciar" class="eliminar">Vaciar carrito</button>
    </div>

    <script src="js/api.js"></script>
    <script src="js/carrito.js"></script>
</body>
</html>
