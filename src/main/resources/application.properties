# ==========================================================
# Configuracion general - equivalente a App/Config.php
# ==========================================================
server.port=8080

# --- Base de datos (misma BD "cc" del proyecto PHP original) ---
spring.datasource.url=jdbc:mysql://localhost:3306/cc?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=USAC123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# update: crea/actualiza tablas automaticamente si no existen (usa las mismas
# tablas y columnas que el script/cc.sql original, asi que si ya tienes esa
# base de datos importada, Hibernate simplemente las reconocera).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# IMPORTANTE: evita que Hibernate convierta "idProducto" -> "id_producto".
# Sin esto, no reconoce las columnas de tu tabla original y falla la FK.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# --- Logs ---
logging.level.org.hibernate.SQL=DEBUG